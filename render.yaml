services:
  - type: web
    name: evac-ai-map-service
    plan: free
    runtime: python
    rootDir: map-service
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.11"

  - type: web
    name: evac-ai-backend
    plan: free
    runtime: node
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: AI_SERVICE_URL
        sync: false
      - key: MAP_SERVICE_URL
        sync: false
