services:
  - type: pserv
    name: evac-ai-map-service
    runtime: python
    rootDir: map-service
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.11"

  - type: pserv
    name: evac-ai-ai-service
    runtime: python
    plan: 1c-2g
    rootDir: ai-service
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.11"
      - key: PERSON_MODEL_PATH
        value: models/person/yolo26n.pt
      - key: FIRE_SMOKE_MODEL_PATH
        value: models/fire_smoke/best.pt

  - type: web
    name: evac-ai-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: AI_SERVICE_HOSTPORT
        fromService:
          type: pserv
          name: evac-ai-ai-service
          property: hostport
      - key: MAP_SERVICE_HOSTPORT
        fromService:
          type: pserv
          name: evac-ai-map-service
          property: hostport
